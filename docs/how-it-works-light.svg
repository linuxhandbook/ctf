<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" role="img" aria-label="Levels run in Docker on your computer. play.py downloads one level image at a time and sends only your handle and the flags you find to ctf.linuxhandbook.com, which keeps the leaderboard shown on linuxhandbook.com." font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Levels run in Docker on your computer. play.py downloads one level image at a time and sends only your handle and the flags you find to ctf.linuxhandbook.com, which keeps the leaderboard shown on linuxhandbook.com.</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/>
  </filter>
  <marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a52c5b"/></marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="960" height="470" rx="16" fill="#ffffff"/>
<rect x="24" y="24" width="420" height="400" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="24" y="24" width="420" height="4" rx="2" fill="#a52c5b"/>
<text x="40" y="50" font-size="13" font-weight="700" fill="#1f2328">Your computer</text>
<g filter="url(#sh)"><rect x="48" y="68" width="372" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/></g>
<rect x="48" y="78" width="3" height="72" rx="1.5" fill="#a52c5b"/>
<g transform="translate(62,80)" fill="none" stroke="#a52c5b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="18" height="16" rx="3"/><path d="M5 8l3 2.5L5 13M10 13h5"/></g>
<text x="92" y="94" font-size="13.5" font-weight="700" fill="#1f2328">play.py</text>
<text x="64" y="116" font-size="12" fill="#59636e">Menu, level shell, flag submit</text>
<text x="64" y="133" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">~/.ctf_user  your handle&#x27;s key</text>
<g filter="url(#sh)"><rect x="48" y="262" width="372" height="136" rx="10" fill="#ffffff" stroke="#d0d7de"/></g>
<rect x="48" y="272" width="3" height="116" rx="1.5" fill="#a52c5b"/>
<g transform="translate(62,274)" fill="none" stroke="#a52c5b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.5l8 4v9l-8 4-8-4v-9z"/><path d="M2 5.5l8 4 8-4M10 9.5v9"/></g>
<text x="92" y="288" font-size="13.5" font-weight="700" fill="#1f2328">Level container</text>
<text x="64" y="310" font-size="12" fill="#59636e">Tiny Alpine Linux box with a hint and a</text>
<text x="64" y="327" font-size="12" fill="#59636e">hidden flag. You poke around with real</text>
<text x="64" y="344" font-size="12" fill="#59636e">commands, then leave with the flag.</text>
<text x="64" y="361" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">docker run, one level at a time</text>
<path d="M 234 160 L 234 256" fill="none" stroke="#a52c5b" stroke-width="1.8" marker-end="url(#a-pink)"/>
<rect x="158.4" y="198" width="151.2" height="20" rx="10" fill="#ffffff" stroke="#a52c5b" stroke-opacity="0.55"/>
<text x="234" y="212" font-size="11.5" text-anchor="middle" fill="#a52c5b">starts, opens a shell</text>
<rect x="560" y="24" width="376" height="116" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="560" y="24" width="376" height="4" rx="2" fill="#0f766e"/>
<text x="576" y="50" font-size="13" font-weight="700" fill="#1f2328">CTF server</text>
<text x="658.8" y="50" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">ctf.linuxhandbook.com</text>
<g filter="url(#sh)"><rect x="584" y="62" width="328" height="60" rx="10" fill="#ffffff" stroke="#d0d7de"/></g>
<rect x="584" y="72" width="3" height="40" rx="1.5" fill="#0f766e"/>
<g transform="translate(598,74)" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="16" height="7" rx="2"/><rect x="2" y="11" width="16" height="7" rx="2"/><path d="M6 5.5h.01M6 14.5h.01"/></g>
<text x="628" y="88" font-size="13.5" font-weight="700" fill="#1f2328">Checks flags, keeps scores</text>
<text x="600" y="110" font-size="12" fill="#59636e">Handles, progress, leaderboards</text>
<rect x="560" y="164" width="376" height="116" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="560" y="164" width="376" height="4" rx="2" fill="#4f46e5"/>
<text x="576" y="190" font-size="13" font-weight="700" fill="#1f2328">Linux Handbook</text>
<text x="687.9200000000001" y="190" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">linuxhandbook.com</text>
<g filter="url(#sh)"><rect x="584" y="202" width="328" height="60" rx="10" fill="#ffffff" stroke="#d0d7de"/></g>
<rect x="584" y="212" width="3" height="40" rx="1.5" fill="#4f46e5"/>
<g transform="translate(598,214)" fill="none" stroke="#4f46e5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.5"/><path d="M1.5 10h17M10 1.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/></g>
<text x="628" y="228" font-size="13.5" font-weight="700" fill="#1f2328">CTF page and account</text>
<text x="600" y="250" font-size="12" fill="#59636e">Live leaderboard, optional sign-in</text>
<rect x="560" y="304" width="376" height="120" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="560" y="304" width="376" height="4" rx="2" fill="#475569"/>
<text x="576" y="330" font-size="13" font-weight="700" fill="#1f2328">GitHub Container Registry</text>
<text x="768.0" y="330" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">ghcr.io</text>
<g filter="url(#sh)"><rect x="584" y="342" width="328" height="60" rx="10" fill="#ffffff" stroke="#d0d7de"/></g>
<rect x="584" y="352" width="3" height="40" rx="1.5" fill="#475569"/>
<g transform="translate(598,354)" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.5l8 4v9l-8 4-8-4v-9z"/><path d="M2 5.5l8 4 8-4M10 9.5v9"/></g>
<text x="628" y="368" font-size="13.5" font-weight="700" fill="#1f2328">Level images</text>
<text x="600" y="390" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#59636e">linuxhandbook/ctf:&lt;ctf&gt;-l&lt;N&gt;</text>
<path d="M 420 92 L 578 92" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a-teal)"/>
<rect x="449.1" y="82" width="99.7" height="20" rx="10" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.55"/>
<text x="499" y="96" font-size="11.5" text-anchor="middle" fill="#0f766e">handle, flags</text>
<path d="M 578 372 L 426 372" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>
<rect x="455.4" y="362" width="93.2" height="20" rx="10" fill="#ffffff" stroke="#475569" stroke-opacity="0.55"/>
<text x="502" y="376" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#475569">docker pull</text>
<path d="M 748 196 L 748 128" fill="none" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#a-indigo)"/>
<rect x="685.3" y="142" width="125.5" height="20" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.55"/>
<text x="748" y="156" font-size="11.5" text-anchor="middle" fill="#4f46e5">reads leaderboard</text>
<text x="480" y="452" font-size="12" font-weight="400" text-anchor="middle" fill="#59636e">The server never runs anything on your machine. It only sees your handle and the flags you submit.</text>
</svg>
